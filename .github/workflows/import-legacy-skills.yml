name: Import Legacy Skills

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-legacy-skills.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest DEDAL Core main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch pinned source skill snapshot
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/Ye-Shwethway/medicine-store-assistant.git /tmp/msa-source
          git -C /tmp/msa-source checkout --quiet 6b8f35e4056f030a1ace2dac137cde1071a00051
          rm -rf skills/medicine-store-assistant skills/patient-report-assistant
          cp -a /tmp/msa-source/skills/medicine-store-assistant skills/medicine-store-assistant
          cp -a /tmp/msa-source/skills/patient-report-assistant skills/patient-report-assistant

      - name: Add provenance records
        shell: bash
        run: |
          cat > skills/medicine-store-assistant/IMPORT_SOURCE.md <<'EOF'
          # Import provenance

          Imported from `Ye-Shwethway/medicine-store-assistant`.

          - Source branch: `main`
          - Source commit: `6b8f35e4056f030a1ace2dac137cde1071a00051`
          - Source path: `skills/medicine-store-assistant/`
          - Imported into DEDAL Core: 2026-09-13

          This directory is a DEDAL Core snapshot of the standalone Medicine Store Assistant skill. The source project remains independent and may continue evolving. Future syncs should compare the recorded source commit before replacing local files.
          EOF

          cat > skills/patient-report-assistant/IMPORT_SOURCE.md <<'EOF'
          # Import provenance

          Imported from `Ye-Shwethway/medicine-store-assistant`.

          - Source branch: `main`
          - Source commit: `6b8f35e4056f030a1ace2dac137cde1071a00051`
          - Source path: `skills/patient-report-assistant/`
          - Imported into DEDAL Core: 2026-09-13

          This directory is a DEDAL Core snapshot of the standalone Patient Report Assistant skill. The source project remains independent and may continue evolving. Future syncs should compare the recorded source commit before replacing local files.
          EOF

      - name: Verify imported trees against pinned source
        shell: bash
        run: |
          set -euo pipefail
          diff -ru --exclude=IMPORT_SOURCE.md /tmp/msa-source/skills/medicine-store-assistant skills/medicine-store-assistant
          diff -ru --exclude=IMPORT_SOURCE.md /tmp/msa-source/skills/patient-report-assistant skills/patient-report-assistant

      - name: Commit imported snapshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DEDAL Core Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add skills/medicine-store-assistant skills/patient-report-assistant
          if git diff --cached --quiet; then
            echo 'Skill snapshots already match pinned source.'
            exit 0
          fi
          git commit -m 'Import pinned MSA and PRA skill snapshots'
          git push origin HEAD:main
