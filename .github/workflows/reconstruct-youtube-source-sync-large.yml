name: Reconstruct YouTube Source Sync Large Files

on:
  push:
    branches:
      - dedal-youtube-source-sync-stage

permissions:
  contents: write

jobs:
  reconstruct:
    if: github.event.head_commit.message == 'Stage deterministic YouTube source-sync transport'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and verify authenticated large files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/blobs"
          OUT=/tmp/large-files.tar.gz
          : > "$OUT"
          for SHA in \
            bb1db4f97f4ee810b2d9abfb1598b82defd3b4e6 \
            fb6545ae514d9960049b0fe9c225136c4c43711d \
            e67b16262880fc20048063bd6e845e959297eac9 \
            58a1103b706e8677eac86fe83736dcfaf66da6ca
          do
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$API/$SHA" \
            | python -c 'import base64,json,sys; d=json.load(sys.stdin); sys.stdout.buffer.write(base64.b64decode(d["content"]))' \
            >> "$OUT"
          done
          echo 'f0ac4e43e235b9640c529c54e2deb08b1642da5aab0bd8c79795f280b67cab99  /tmp/large-files.tar.gz' | sha256sum -c -
          mkdir -p /tmp/reconstructed
          tar -xzf "$OUT" -C /tmp/reconstructed
          echo '00eaa92d456b879d9115182eada2c32dc93f467830e6d42e5c4181f7a0d60228  /tmp/reconstructed/gateway.js' | sha256sum -c -
          echo '6b1ee3b153986d89bcc1c69cd1bf10949b786005266e51db09ebc255562ae1f1  /tmp/reconstructed/mcp.js' | sha256sum -c -
          test "$(git hash-object /tmp/reconstructed/gateway.js)" = '855118abfce53cdec54cccd4c8d7528203c67bba'
          test "$(git hash-object /tmp/reconstructed/mcp.js)" = '7192b6bbaf2d0a73867d75e4553475a2cd008c3f'
          cp /tmp/reconstructed/gateway.js skills/youtube-publishing/gateway/src/index.js
          cp /tmp/reconstructed/mcp.js skills/youtube-publishing/mcp/src/index.js
          git add skills/youtube-publishing/gateway/src/index.js skills/youtube-publishing/mcp/src/index.js
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Reconstruct authenticated YouTube source-sync large files'
          git push origin HEAD:dedal-youtube-source-sync-stage
