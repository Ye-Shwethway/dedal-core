name: Finalize YouTube Source Sync Source Versions

on:
  push:
    branches:
      - dedal-youtube-source-sync-stage

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'Stage final YouTube source-sync source versions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify authenticated source and apply gate-owned public versions
        run: |
          set -euo pipefail
          GATEWAY=skills/youtube-publishing/gateway/src/index.js
          MCP=skills/youtube-publishing/mcp/src/index.js
          echo '00eaa92d456b879d9115182eada2c32dc93f467830e6d42e5c4181f7a0d60228  skills/youtube-publishing/gateway/src/index.js' | sha256sum -c -
          echo '6b1ee3b153986d89bcc1c69cd1bf10949b786005266e51db09ebc255562ae1f1  skills/youtube-publishing/mcp/src/index.js' | sha256sum -c -
          test "$(git hash-object "$GATEWAY")" = '855118abfce53cdec54cccd4c8d7528203c67bba'
          test "$(git hash-object "$MCP")" = '7192b6bbaf2d0a73867d75e4553475a2cd008c3f'
          python - <<'PY'
          from pathlib import Path
          p=Path('skills/youtube-publishing/gateway/src/index.js')
          s=p.read_text()
          old='const VERSION = "0.3.0";'
          assert s.count(old)==1
          p.write_text(s.replace(old,'const VERSION = "0.4.0";',1))
          p=Path('skills/youtube-publishing/mcp/src/index.js')
          s=p.read_text()
          old='const VERSION = "0.1.0";'
          assert s.count(old)==1
          p.write_text(s.replace(old,'const VERSION = "0.2.0";',1))
          PY
          echo 'd51f862d9020feb2db12e94df621b54bf021c4b32bdfa75199b26c0919ddf0a1  skills/youtube-publishing/gateway/src/index.js' | sha256sum -c -
          echo '211b85cf780cfb1b926d6cf19a84050000d8ef6b9e4887f118198b91eb7b7b4d  skills/youtube-publishing/mcp/src/index.js' | sha256sum -c -
          test "$(git hash-object "$GATEWAY")" = '826bc192bbd544ca0d6c2593a08eb1fbed60c85f'
          test "$(git hash-object "$MCP")" = '997c100ce376686b0096d2176864f3d7ba2b2300'
          node --check "$GATEWAY"
          node --check "$MCP"
          git add "$GATEWAY" "$MCP"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Finalize public YouTube source versions'
          git push origin HEAD:dedal-youtube-source-sync-stage
