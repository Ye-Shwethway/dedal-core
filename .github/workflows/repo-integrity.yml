name: Repo Integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate foundational files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            AGENTS.md
            SECURITY.md
            VERSION
            kernel/KERNEL.md
            kernel/BOOT_CONTRACT.md
            kernel/STATE_BOUNDARY.md
            docs/IDENTITY.md
            docs/architecture/FOUNDATION.md
            docs/architecture/BIOS_AND_LAYER_MODEL.md
            docs/capabilities/CURRENT_CAPABILITIES.md
            docs/continuity/CURRENT_CHECKPOINT.md
            docs/evolution/IMPROVEMENT_PROTOCOL.md
            state/capability-registry.yaml
            index/MASTER_INDEX.md
            index/SKILL_REGISTRY.yaml
          )

          for file in "${required[@]}"; do
            test -s "$file" || {
              echo "Missing or empty required file: $file"
              exit 1
            }
          done

      - name: Reject obvious committed secret files
        shell: bash
        run: |
          set -euo pipefail
          bad_files=$(git ls-files | grep -E '(^|/)(\.env($|\.)|id_rsa$|id_ed25519$|.*\.(pem|p12|pfx|key)$)' || true)
          if [ -n "$bad_files" ]; then
            echo "Potential secret-bearing files are committed:"
            echo "$bad_files"
            exit 1
          fi

      - name: Validate YAML registries
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; YAML.load_file("state/capability-registry.yaml"); YAML.load_file("index/SKILL_REGISTRY.yaml"); puts "YAML registries: valid"'

      - name: Validate skill entrypoints
        shell: bash
        run: |
          set -euo pipefail
          required_skills=(
            medicine-store-assistant
            patient-report-assistant
            ika
            github
            files
            research
            software-development
            automations
            skill-acquisition
          )
          for skill in "${required_skills[@]}"; do
            test -s "skills/$skill/SKILL.md" || {
              echo "Missing skill entrypoint: skills/$skill/SKILL.md"
              exit 1
            }
          done
          test -s skills/medicine-store-assistant/IMPORT_SOURCE.md
          test -s skills/patient-report-assistant/IMPORT_SOURCE.md
          test -s skills/medicine-store-assistant/agents/openai.yaml
          test -s skills/patient-report-assistant/agents/openai.yaml
          test "$(find skills/medicine-store-assistant/references -type f | wc -l)" -ge 10
          test "$(find skills/patient-report-assistant/references -type f | wc -l)" -ge 8
          test -s skills/ika/ADAPTATION_NOTES.md
          test "$(find skills/ika/references -type f | wc -l)" -ge 4
          grep -q 'fbed860928c1a93261306f70a47fa700da56ce29' skills/ika/ADAPTATION_NOTES.md
          test "$(find skills/skill-acquisition/references -type f | wc -l)" -ge 4
          grep -q 'Reuse ideas' skills/skill-acquisition/SKILL.md

      - name: Validate version format
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' VERSION
