name: Repo Integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate foundational files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            AGENTS.md
            SECURITY.md
            VERSION
            docs/IDENTITY.md
            docs/architecture/FOUNDATION.md
            docs/architecture/BIOS_AND_LAYER_MODEL.md
            docs/capabilities/CURRENT_CAPABILITIES.md
            docs/continuity/CURRENT_CHECKPOINT.md
            docs/evolution/IMPROVEMENT_PROTOCOL.md
            state/capability-registry.yaml
            index/MASTER_INDEX.md
            index/SKILL_REGISTRY.yaml
            skills/medicine-store-assistant/SKILL.md
            skills/medicine-store-assistant/IMPORT_SOURCE.md
            skills/patient-report-assistant/SKILL.md
            skills/patient-report-assistant/IMPORT_SOURCE.md
          )

          for file in "${required[@]}"; do
            test -s "$file" || {
              echo "Missing or empty required file: $file"
              exit 1
            }
          done

      - name: Reject obvious committed secret files
        shell: bash
        run: |
          set -euo pipefail
          bad_files=$(git ls-files | grep -E '(^|/)(\.env($|\.)|id_rsa$|id_ed25519$|.*\.(pem|p12|pfx|key)$)' || true)
          if [ -n "$bad_files" ]; then
            echo "Potential secret-bearing files are committed:"
            echo "$bad_files"
            exit 1
          fi

      - name: Validate YAML registries
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; YAML.load_file("state/capability-registry.yaml"); YAML.load_file("index/SKILL_REGISTRY.yaml"); puts "YAML registries: valid"'

      - name: Validate imported skill package structure
        shell: bash
        run: |
          set -euo pipefail
          test -d skills/medicine-store-assistant/references
          test -d skills/patient-report-assistant/references
          test -s skills/medicine-store-assistant/agents/openai.yaml
          test -s skills/patient-report-assistant/agents/openai.yaml
          msa_refs=$(find skills/medicine-store-assistant/references -maxdepth 1 -type f | wc -l)
          pra_refs=$(find skills/patient-report-assistant/references -maxdepth 1 -type f | wc -l)
          test "$msa_refs" -ge 15
          test "$pra_refs" -ge 8
          echo "Imported skill packages present: MSA=$msa_refs refs, PRA=$pra_refs refs"
