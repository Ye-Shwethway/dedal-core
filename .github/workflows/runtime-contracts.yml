name: Runtime Contracts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate executable runtime contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile runtime/github_mutation_guard.py scripts/validate_runtime_contracts.py scripts/validate_context_contract.py scripts/validate_self_improvement_contract.py scripts/validate_self_improvement_closure.py scripts/validate_tool_authority_contract.py scripts/validate_delegation_authority_contract.py scripts/validate_failure_recovery_contract.py scripts/validate_capability_composition_contract.py scripts/validate_quality_engineering_routing.py scripts/validate_cloudflare_platform_routing.py scripts/validate_cloudflare_platform_operations.py scripts/validate_database_engineering_routing.py scripts/validate_mobile_reference_pack_routing.py scripts/validate_reliability_engineering_routing.py scripts/validate_infrastructure_engineering_routing.py scripts/validate_creative_production_routing.py scripts/validate_youtube_publishing_hardening.py scripts/validate_youtube_source_sync.py scripts/validate_candidate_video_finder_routing.py scripts/validate_facebook_page_management.py scripts/validate_msa_master_data_archive.py scripts/validate_public_repo_privacy.py skills/youtube-publishing/runner/dedal_youtube_uploader.py skills/youtube-publishing/runner/dedal_youtube_runner_daemon.py
          node --input-type=module --check < skills/youtube-publishing/gateway/src/index.js
          node --input-type=module --check < skills/youtube-publishing/mcp/src/index.js
          python3 scripts/validate_runtime_contracts.py
          python3 scripts/validate_context_contract.py
          python3 scripts/validate_self_improvement_contract.py
          python3 scripts/validate_self_improvement_closure.py
          python3 scripts/validate_tool_authority_contract.py
          python3 scripts/validate_delegation_authority_contract.py
          python3 scripts/validate_failure_recovery_contract.py
          python3 scripts/validate_capability_composition_contract.py
          python3 scripts/validate_quality_engineering_routing.py
          python3 scripts/validate_cloudflare_platform_routing.py
          python3 scripts/validate_cloudflare_platform_operations.py
          python3 scripts/validate_database_engineering_routing.py
          python3 scripts/validate_mobile_reference_pack_routing.py
          python3 scripts/validate_reliability_engineering_routing.py
          python3 scripts/validate_infrastructure_engineering_routing.py
          python3 scripts/validate_creative_production_routing.py
          python3 scripts/validate_youtube_publishing_hardening.py
          python3 scripts/validate_youtube_source_sync.py
          python3 scripts/validate_youtube_media_staging.py
          python3 scripts/validate_youtube_seo_routing.py
          python3 scripts/validate_candidate_video_finder_routing.py
          python3 scripts/validate_facebook_page_management.py
          python3 scripts/validate_msa_master_data_archive.py
          python3 scripts/validate_public_repo_privacy.py
