name: Runtime Contracts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate executable runtime contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install PyYAML==6.0.3 jsonschema==4.25.1
          python3 validators/validate_core.py
          python3 scripts/session_check.py
          python3 scripts/validate_library_authority.py
          python3 scripts/validate_document_schema.py
          python3 scripts/validate_core_contracts.py
          python3 scripts/validate_core_contracts_negative.py
          python3 scripts/validate_route_decision_negative.py
          python3 scripts/validate_release_manifest.py
          python3 scripts/validate_release_manifest_negative.py
          python3 scripts/validate_profile_probe.py
          python3 scripts/validate_session_receipt.py
          python3 scripts/validate_refinement.py
          python3 scripts/validate_lightweight_runtime.py
          python3 scripts/validate_release_architecture.py
          python3 -m unittest discover -s evals/creative-handoff -p "test_*.py" -q
          python3 -m py_compile scripts/validate_creative_handoff.py
          python3 scripts/validate_creative_source_plan.py
          python3 scripts/validate_resource_intelligence.py
          python3 scripts/validate_response_policy.py
          python3 scripts/validate_hfr.py
          python3 -m py_compile scripts/resource_review.py
          python3 -m py_compile scripts/evidence.py scripts/context_plan.py scripts/publication.py scripts/outcome_properties.py scripts/controlled_comparison.py
          python3 -m py_compile runtime/github_mutation_guard.py scripts/route_task.py scripts/validate_route_decision.py scripts/validate_route_decision_negative.py scripts/build_release_manifest.py scripts/validate_release_manifest.py scripts/validate_release_manifest_negative.py scripts/validate_core_contracts.py scripts/validate_core_contracts_negative.py scripts/validate_runtime_contracts.py scripts/validate_context_contract.py scripts/validate_self_improvement_contract.py scripts/validate_self_improvement_closure.py scripts/validate_tool_authority_contract.py scripts/validate_delegation_authority_contract.py scripts/validate_failure_recovery_contract.py scripts/validate_capability_composition_contract.py scripts/validate_quality_engineering_routing.py scripts/validate_cloudflare_platform_routing.py scripts/validate_cloudflare_platform_operations.py scripts/validate_database_engineering_routing.py scripts/validate_mobile_reference_pack_routing.py scripts/validate_reliability_engineering_routing.py scripts/validate_infrastructure_engineering_routing.py scripts/validate_creative_production_routing.py scripts/validate_visual_narrative_production.py scripts/validate_story_weaver.py scripts/validate_youtube_publishing_hardening.py scripts/validate_youtube_source_sync.py scripts/validate_candidate_video_finder_routing.py scripts/validate_facebook_page_management.py scripts/validate_msa_master_data_archive.py scripts/validate_msa_local_code_registry.py scripts/validate_public_repo_privacy.py skills/youtube-publishing/runner/dedal_youtube_uploader.py skills/youtube-publishing/runner/dedal_youtube_runner_daemon.py
          node --input-type=module --check < skills/youtube-publishing/gateway/src/index.js
          node --input-type=module --check < skills/youtube-publishing/mcp/src/index.js
          python3 scripts/validate_runtime_contracts.py
          python3 scripts/validate_context_contract.py
          python3 scripts/validate_self_improvement_contract.py
          python3 scripts/validate_self_improvement_closure.py
          python3 scripts/validate_tool_authority_contract.py
          python3 scripts/validate_delegation_authority_contract.py
          python3 scripts/validate_failure_recovery_contract.py
          python3 scripts/validate_capability_composition_contract.py
          python3 scripts/validate_quality_engineering_routing.py
          python3 scripts/validate_cloudflare_platform_routing.py
          python3 scripts/validate_cloudflare_platform_operations.py
          python3 scripts/validate_database_engineering_routing.py
          python3 scripts/validate_mobile_reference_pack_routing.py
          python3 scripts/validate_reliability_engineering_routing.py
          python3 scripts/validate_infrastructure_engineering_routing.py
          python3 scripts/validate_creative_production_routing.py
          python3 scripts/validate_visual_narrative_production.py
          python3 scripts/validate_generative_video_direction.py
          python3 scripts/validate_story_weaver.py
          python3 scripts/validate_media_workflow.py
          python3 scripts/validate_youtube_publishing_hardening.py
          python3 scripts/validate_youtube_source_sync.py
          python3 scripts/validate_youtube_media_staging.py
          python3 scripts/validate_youtube_seo_routing.py
          python3 scripts/validate_candidate_video_finder_routing.py
          python3 scripts/validate_facebook_page_management.py
          python3 scripts/validate_msa_master_data_archive.py
          python3 scripts/validate_msa_local_code_registry.py
          python3 scripts/validate_public_repo_privacy.py
