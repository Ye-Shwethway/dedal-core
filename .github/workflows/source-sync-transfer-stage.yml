name: Source Sync Transfer Stage
on:
  push:
    branches: [dedal-youtube-source-sync-stage5]
permissions:
  contents: write
jobs:
  reconstruct:
    if: github.event.head_commit.message != 'Reconstruct source-sync payload'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Reconstruct authenticated large source files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/source-sync-parts
          shas=(
            bb1db4f97f4ee810b2d9abfb1598b82defd3b4e6
            fb6545ae514d9960049b0fe9c225136c4c43711d
            e67b16262880fc20048063bd6e845e959297eac9
            58a1103b706e8677eac86fe83736dcfaf66da6ca
          )
          expected=(
            15b677522b3ae63868e2b0c4fc9068ba1465cc2aa6a85d47f1e2c0d839d14136
            ef8f1f50529330fee33f1ef7406a9165e7ab62d619dc2159f0f99c576aeb7252
            84e5f1617109b639987b022ad17b62c7dd80e429e76044c3d320dcffcb103717
            4d975a50be5e963995d1dcf1cc380d11aeea143d8f06dec99f5bfdd006c23259
          )
          for i in 0 1 2 3; do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${shas[$i]}" \
              | jq -r '.content' | tr -d '\n' | base64 -d > "/tmp/source-sync-parts/part-$i"
            echo "${expected[$i]}  /tmp/source-sync-parts/part-$i" | sha256sum -c -
          done
          cat /tmp/source-sync-parts/part-{0,1,2,3} > /tmp/large-files.tar.gz
          echo 'f0ac4e43e235b9640c529c54e2deb08b1642da5aab0bd8c79795f280b67cab99  /tmp/large-files.tar.gz' | sha256sum -c -
          tar -xzf /tmp/large-files.tar.gz -C .
          echo '00eaa92d456b879d9115182eada2c32dc93f467830e6d42e5c4181f7a0d60228  skills/youtube-publishing/gateway/src/index.js' | sha256sum -c -
          echo '6b1ee3b153986d89bcc1c69cd1bf10949b786005266e51db09ebc255562ae1f1  skills/youtube-publishing/mcp/src/index.js' | sha256sum -c -
          test "$(git hash-object skills/youtube-publishing/gateway/src/index.js)" = '855118abfce53cdec54cccd4c8d7528203c67bba'
          test "$(git hash-object skills/youtube-publishing/mcp/src/index.js)" = '7192b6bbaf2d0a73867d75e4553475a2cd008c3f'
          python3 - <<'PY'
          from pathlib import Path
          for path, old, new in [
              ('skills/youtube-publishing/gateway/src/index.js', 'const VERSION = "0.3.0";', 'const VERSION = "0.4.0";'),
              ('skills/youtube-publishing/mcp/src/index.js', 'const VERSION = "0.1.0";', 'const VERSION = "0.2.0";'),
          ]:
              p = Path(path)
              s = p.read_text()
              assert s.count(old) == 1, (path, s.count(old))
              p.write_text(s.replace(old, new, 1))
          PY
          echo 'd51f862d9020feb2db12e94df621b54bf021c4b32bdfa75199b26c0919ddf0a1  skills/youtube-publishing/gateway/src/index.js' | sha256sum -c -
          echo '211b85cf780cfb1b926d6cf19a84050000d8ef6b9e4887f118198b91eb7b7b4d  skills/youtube-publishing/mcp/src/index.js' | sha256sum -c -
          test "$(git hash-object skills/youtube-publishing/gateway/src/index.js)" = '826bc192bbd544ca0d6c2593a08eb1fbed60c85f'
          test "$(git hash-object skills/youtube-publishing/mcp/src/index.js)" = '997c100ce376686b0096d2176864f3d7ba2b2300'
          rm .github/workflows/source-sync-transfer-stage.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add skills/youtube-publishing/gateway/src/index.js skills/youtube-publishing/mcp/src/index.js .github/workflows/source-sync-transfer-stage.yml
          git commit -m 'Reconstruct source-sync payload'
          git push origin HEAD:${GITHUB_REF_NAME}
