name: YouTube Source Sync Small Transport
on:
  push:
    branches:
      - dedal-youtube-source-sync-stage5
permissions:
  contents: write
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and verify exact small files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dedal-small /tmp/dedal-small-extract
          : > /tmp/dedal-small/small-files.tar.gz
          for sha in 0eb8833bf62a85ac0658164df81053c8b0df2ddf 4f055a7968e4da3d77e300273a6549a6f7ce03f6; do
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/git/blobs/$sha" | jq -r '.content' | tr -d '\n' | base64 -d >> /tmp/dedal-small/small-files.tar.gz
          done
          echo "37140f60debf1f6e1dfc65a3425fd073d39a8dc451466da014bcd503ee8e9b0d  /tmp/dedal-small/small-files.tar.gz" | sha256sum -c -
          tar -xzf /tmp/dedal-small/small-files.tar.gz -C /tmp/dedal-small-extract
          cd /tmp/dedal-small-extract
          test "$(git hash-object .github/workflows/runtime-contracts.yml)" = "6ccdafb47376648eefea9c6b2d89a5a87a201b4f"
          test "$(git hash-object VERSION)" = "1b58cc10180e8f9c89a04f79f5a4dc4608309cde"
          test "$(git hash-object docs/continuity/CURRENT_CHECKPOINT.md)" = "8656592969f4d62ff8b562a9c008945c61e5adc5"
          test "$(git hash-object docs/releases/0.27.0.md)" = "2477178299b8d7b76f9d8954c6c35b4991f8a0a2"
          test "$(git hash-object evals/youtube-source-sync/contract-v1.json)" = "7d0320631ca96d456c3501361010a5923df966ad"
          test "$(git hash-object scripts/validate_public_repo_privacy.py)" = "ef9b9e4a7753852bdfc047f0e55d27248194001f"
          test "$(git hash-object scripts/validate_youtube_publishing_hardening.py)" = "b1b91df74d260784d1a66adb16d29925bafcc3b0"
          test "$(git hash-object scripts/validate_youtube_source_sync.py)" = "35b3d62e56b2468129d54558ba9edc6d07852f2c"
          test "$(git hash-object skills/youtube-publishing/CURRENT_CHECKPOINT.md)" = "fda879507d400ca3a41cef1f5e29ea46ca06a672"
          test "$(git hash-object skills/youtube-publishing/gateway/README.md)" = "a45ff98dcf3d278ce939d3c073dc81d73efe67de"
          test "$(git hash-object skills/youtube-publishing/gateway/migrations/0004_playlist_image_state.sql)" = "f28080d04dfa882fed9cbe73dfe955f99f9337fd"
          test "$(git hash-object skills/youtube-publishing/gateway/wrangler.toml)" = "9ef90a5991e1043793522868075b683bae2dea9d"
          test "$(git hash-object skills/youtube-publishing/mcp/README.md)" = "61b60615a3aeb490e256a9d05d6ef9cd93f9bf2e"
          test "$(git hash-object state/current-checkpoint.json)" = "7db941e6cc130d68a844bef8f831f3f81db12a0a"
          cd "$GITHUB_WORKSPACE"
          cp -a /tmp/dedal-small-extract/. ./
          rm -f .github/workflows/youtube-source-sync-small-transport.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reconstruct exact YouTube source-sync small files"
          git push origin HEAD:dedal-youtube-source-sync-stage5
