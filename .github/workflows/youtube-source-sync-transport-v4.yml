name: YouTube Source Sync Transport V4
on:
  push:
    branches:
      - dedal-youtube-source-sync-stage4
permissions:
  contents: write
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct authenticated source and apply version-only gate edits
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dedal-transport /tmp/dedal-extract
          : > /tmp/dedal-transport/large-files.tar.gz
          for sha in bb1db4f97f4ee810b2d9abfb1598b82defd3b4e6 fb6545ae514d9960049b0fe9c225136c4c43711d e67b16262880fc20048063bd6e845e959297eac9 58a1103b706e8677eac86fe83736dcfaf66da6ca; do
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/git/blobs/$sha" | jq -r '.content' | tr -d '\n' | base64 -d >> /tmp/dedal-transport/large-files.tar.gz
          done
          echo "f0ac4e43e235b9640c529c54e2deb08b1642da5aab0bd8c79795f280b67cab99  /tmp/dedal-transport/large-files.tar.gz" | sha256sum -c -
          tar -xzf /tmp/dedal-transport/large-files.tar.gz -C /tmp/dedal-extract
          GW=/tmp/dedal-extract/skills/youtube-publishing/gateway/src/index.js
          MCP=/tmp/dedal-extract/skills/youtube-publishing/mcp/src/index.js
          echo "00eaa92d456b879d9115182eada2c32dc93f467830e6d42e5c4181f7a0d60228  $GW" | sha256sum -c -
          echo "6b1ee3b153986d89bcc1c69cd1bf10949b786005266e51db09ebc255562ae1f1  $MCP" | sha256sum -c -
          test "$(git hash-object "$GW")" = "855118abfce53cdec54cccd4c8d7528203c67bba"
          test "$(git hash-object "$MCP")" = "7192b6bbaf2d0a73867d75e4553475a2cd008c3f"
          python -c 'from pathlib import Path; p=Path("/tmp/dedal-extract/skills/youtube-publishing/gateway/src/index.js"); s=p.read_text(); old="const VERSION = \"0.3.0\";"; assert s.count(old)==1; p.write_text(s.replace(old,"const VERSION = \"0.4.0\";",1))'
          python -c 'from pathlib import Path; p=Path("/tmp/dedal-extract/skills/youtube-publishing/mcp/src/index.js"); s=p.read_text(); old="const VERSION = \"0.1.0\";"; assert s.count(old)==1; p.write_text(s.replace(old,"const VERSION = \"0.2.0\";",1))'
          echo "d51f862d9020feb2db12e94df621b54bf021c4b32bdfa75199b26c0919ddf0a1  $GW" | sha256sum -c -
          echo "211b85cf780cfb1b926d6cf19a84050000d8ef6b9e4887f118198b91eb7b7b4d  $MCP" | sha256sum -c -
          test "$(git hash-object "$GW")" = "826bc192bbd544ca0d6c2593a08eb1fbed60c85f"
          test "$(git hash-object "$MCP")" = "997c100ce376686b0096d2176864f3d7ba2b2300"
          cp "$GW" skills/youtube-publishing/gateway/src/index.js
          cp "$MCP" skills/youtube-publishing/mcp/src/index.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/youtube-publishing/gateway/src/index.js skills/youtube-publishing/mcp/src/index.js
          git commit -m "Reconstruct exact YouTube source-sync large files"
          git push origin HEAD:dedal-youtube-source-sync-stage4
