      test design, exploratory and automated verification, regression analysis, defect evidence, and readiness verdicts.
      Use when the task is about proving quality rather than implementing the product or shipping it.
    aliases: []
    entrypoint: skills/quality-engineering/SKILL.md
    status: registered
  cloudflare-platform:
