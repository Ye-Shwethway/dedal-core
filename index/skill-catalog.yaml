schema_version: 1
availability: resolve_current_tools_and_dependencies_per_task
activation: metadata_is_not_content_read_or_execution_readiness
skills:
  medicine-store-assistant:
    use_when: Operate and reconcile a medical-store inventory through authorized Google Sheets while preserving
      the existing Excel/macro contract, exact source-document truth, expiry-separated lots, safe local-to-CMS identity
      matching, separate fixed-asset handling, adaptive reorder reasoning, received-stock processing, expiry/return/discard
      lifecycle management, and a human-first workbook lifecycle. Use for CMS supply intake, Daily Usage entry from
      paper forms or photos, CMS price-list imports and updates, Main Stock reconciliation, received-stock processing,
      fixed-asset transfer routing, reorder/Final Reorder review, near-expiry return-to-CMS review, expired-stock
      retention/discard review, row-lifecycle cleanup review, workbook tab organization, expiry-lot handling, suspicious
      recycled CMS IDs, inventory audits, or whenever the user invokes $msa or medicine-store-assistant.
    aliases:
    - $msa
    - medicine-store-assistant
    entrypoint: skills/medicine-store-assistant/SKILL.md
    status: registered
  patient-report-assistant:
    use_when: Transcribe monthly hospital OPD/IPD paper forms or photos into an authorized Google Sheet, preserve
      the workbook formula/manual-hybrid contract, verify the Monthly Report, and surface manual-only report fields
      for review. Use when the user invokes patient-report-assistant or $pra for monthly patient-report data entry
      or validation.
    aliases:
    - $pra
    - patient-report-assistant
    entrypoint: skills/patient-report-assistant/SKILL.md
    status: registered
  knowledge-archive:
    use_when: Create, load, refresh, audit, and inspect durable evidence-linked project knowledge. Invoke with $ika
      or knowledge-archive tasks.
    aliases:
    - $ika
    - knowledge-archive
    entrypoint: skills/ika/SKILL.md
    status: registered
  github:
