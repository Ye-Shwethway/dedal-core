schema_version: 1
scope: nontrivial_work_units_all_domains
loading: on_demand_not_extra_global_boot
authority: procedural_contract_not_host_interception
record: scripts/execution_check.py
rules:
  - carry_task_owner_operation_phase_and_pending_effects_across_short_continuations_recompose_on_material_change
  - unresolved_lexical_match_requires_semantic_review_never_treat_as_no_workflow
  - distinguish_discovered_loaded_ready_applied_and_verified_skill_states
  - resolve_live_tool_schema_and_required_domain_sources_before_consequential_action
  - bind_constraints_to_actual_tool_arguments_and_inspect_each_required_result_not_just_top_level_success
  - classify_empty_truncated_partial_failed_and_unknown_results_explicitly_never_convert_them_to_zero_or_done
  - reconcile_unknown_mutations_with_owner_readback_before_retry
  - separate_intended_state_observed_state_and_creator_accepted_state
  - record_one_compact_evidence_envelope_reuse_unchanged_context_within_task_and_release
  - keep_required_blockers_and_pending_effects_visible_at_handoff_do_not_backdate_receipts
  - close_only_when_required_items_have_verified_outcomes_or_explicit_authorized_partial_scope
evidence_boundary:
  local_record: declared_coverage_and_consistency_only
  external_truth: authoritative_tool_readback_required
  subjective_quality: inspected_artifact_and_scoped_reviewer_judgment_required
  runtime_guarantee: unavailable_without_actual_host_dispatch_integration
