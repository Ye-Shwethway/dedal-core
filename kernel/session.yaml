version: 0.40.0
start:
- id: read_boot_contract
  kind: read
  file: kernel/boot.yaml
  required: true
- id: read_kernel
  kind: read
  file: kernel/kernel.yaml
  required: true
- id: read_checkpoint
  kind: read
  file: state/checkpoint.yaml
  required: true
- id: resolve_private_state
  kind: resolve
  when: private_overlay_available
- id: route_task
  kind: route
  file: index/routing.yaml
  required: true
- id: hydrate_profile
  kind: hydrate
  when: task_profile_matches
- id: session_readiness
  kind: verify
  command: python scripts/session_check.py
  required: true
  scope: structural_only
execution_readiness:
  command: python scripts/session_check.py --profile PROFILE_ID --task-id TASK_ID
    --task-file TASK.txt --route-decision ROUTE.json --receipt SESSION_RECEIPT.json
    --operation OPERATION --phase PHASE
  route_decision_schema: state/routing-decision.schema.json
  receipt_schema: state/hydration-receipt.schema.json
  required: before_consequential_execution_and_at_phase_closure_when_profile_matches
  no_receipt: fail_closed
  evidence_rule: receipt_coverage_is_not_independent_proof_of_source_read_or_tool_binding
  order_rule: boot_discovery_may_precede_route_hydration_after_route_reuse_requires_explicit_activation
  phase_rule: audit_requires_inspection_gates_only_execution_requires_preconditions_closure_requires_postconditions
  version_rule: use_observed_version_or_explicit_unavailable_with_identity_and_digest_never_invent_version
  verification_rule: coverage_does_not_verify_local_artifacts_or_external_judgment
  local_evidence_command: append --evidence-bundle EVENTS.json --artifact-root ARTIFACT_ROOT
    for receipt evidence_mode local_artifacts
  media_workflow_command: For a profile media_workflow operation append --media-state
    STATE.json; media_workflow_ready must reference sha256 of those exact bytes.
recompose:
- id: material_subgoal_change
  kind: reroute
  when: subgoal_materially_changes
- id: authority_change
  kind: reverify
  when: authoritative_source_or_tool_changes
- id: workflow_gap
  kind: rehydrate
  when: execution_reveals_missing_dependency
end:
- id: update_checkpoint
  kind: write
  when: accepted_core_state_changed
- id: record_learning
  kind: write
  when: durable_workflow_lesson
- id: validate_core
  kind: verify
  command: python validators/validate_core.py
  when: core_changed
- id: persist_phase_trace
  kind: write
  when: nontrivial_composition_or_material_subgoal_change
  requirement: preserve_route_source_reads_checker_result_and_direct_evidence_before_completion_never_backdate
rules:
- id: no_premature_victory
  statement: done_requires_evidence
- id: no_chat_memory_authority
  statement: conversation_summary_can_hint_but_never_replace_checkpoint_or_authoritative_artifact
- id: compact_integrity
  statement: required_machine_files_are_verified_by_essential_checks_required_core_bodies_are_read_in_full_use_context_plan_for_compact_disclosure
