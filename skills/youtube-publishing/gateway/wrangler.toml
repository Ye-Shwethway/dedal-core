name = "dedal-youtube-gateway"
main = "src/index.js"
compatibility_date = "2026-09-14"

[observability]
enabled = true
head_sampling_rate = 1

[[d1_databases]]
binding = "DB"
database_name = "dedal-youtube-gateway-prod"
migrations_dir = "migrations"
# Supply the production D1 database_id only in private deployment configuration.

# Worker Secrets: GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
# TOKEN_ENCRYPTION_KEY_B64, ADMIN_API_TOKEN, RUNNER_API_TOKEN
