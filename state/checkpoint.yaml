version: 0.40.8
date: '2026-10-08'
authority: library_direct_tree
accepted:
  assistant_name: DEDAL
  boot_surface: ChatGPT Library direct tree
  canonical_core: /DEDAL/core
  external_runtime_mcp: retired_not_used
  state_model: reconstruct_from_artifacts_not_chat_memory
  routing: smallest_sufficient_set_plus_task_profile_dependencies
  execution_readiness: phase_scoped_receipt_coverage_plus_direct_tool_evidence
  migration_status: direct_tree_verified
decisions:
- id: interactive_response_ui
  value: Optional task-aware global response presentation uses useful supported native
    controls with text/mobile fallback, explicit demo/calculated/live/persisted labels
    and synchronized local values. Local control changes do not authorize service
    writes, canon mutation or automatic simulation. Universe Observing/Guided/Autonomous
    semantics remain domain-owned. Selection planner/contract tests validate declarations
    only; actual rendering, host callbacks and external truth require direct evidence.
  date: '2026-10-08'
- id: release_sync_recovery
  value: Release closure requires all normative release-version fields, full inventory
    digests, direct canonical readback, private current pointers and sanitized Git
    history to reconcile. Finish-forward recovery preserved later Library domain changes
    and restored previously published discovery-depth contracts; partial version writes
    are not accepted releases.
  date: '2026-10-08'
- id: msa_global_table_formatting
  value: 'Medicine Store Assistant uses a global human-facing workbook formatting
    baseline: thin solid black all-borders; deliberate/special header styles are preserved,
    while otherwise unstyled ordinary headers use the canonical dark-teal #155F82
    fill with white bold centered/middle/wrapped text; border mutations and header-style
    mutations are separated so fills/font colors are not silently reset; freeze panes,
    number/date formats, semantic colors, conditional formatting, formulas, validation
    and template-specific styles remain preserved. Explicit formatting cleanup may
    normalize existing visible human-facing tables while hidden/helper/app-internal
    tabs stay out of blanket-restyle scope.'
  date: '2026-10-07'
- id: cms_price_change_history
  value: 'CMS price-list synchronization is one operational workflow: preserve/version
    the catalogue, identity-gate changes, checkpoint, update only Main Stock CMS Price,
    verify derived Price formulas remain untouched, append idempotent per-lot snapshots
    to visible Price Change History with signed red/green Changed Price, audit, and
    read back. Interrupted runs recover missing history from checkpoint/previous catalogue
    plus live state.'
  date: '2026-10-07'
- id: resource_discovery_breadth
  value: Use source-family/market/angle coverage for broad resource discovery; reconcile
    Creator decisions and relevant owned outcomes before screening; adapt low-yield
    searches and report real coverage. Consumer-specific locators do not define upstream
    resource discovery.
  date: '2026-10-06'
- id: resource_visual_review
  value: Visual resource profiles require retained attributable image proof, DEDAL
    direct inspection before recommendation, and explicit scoped Creator acceptance.
    Resource photos do not verify opportunities; rejections suppress rediscovery.
    Nonvisual policies remain supported. Validators check declarations/bytes, not
    host events or visual taste.
  date: '2026-10-06'
- id: resource_intelligence_global_skill
  value: Resource Intelligence is a resource-type-agnostic persistent discovery and
    tracking faculty. Public Core owns generic profiles, record schemas, discovery/refresh/delta/provenance
    contracts and consumer handoffs; actual tracked targets, preferences, selections
    and accumulated private catalogues remain in the private overlay.
  date: '2026-10-06'
- id: asset_bound_media_release
  value: Separate review delivery, media acceptance and Creator cover choice; operation-specific
    local media checks bind final bytes and block inconsistent closure. Actual tool/Creator
    evidence and prospective phase checks remain required; host interception is unavailable.
  date: '2026-10-06'
- id: creative_source_production
  value: Scene-specific causal and physical events, evidence-aware source QA and source-only
    motion pair decisions; offline planning evidence does not certify rendered realism
    or video quality.
  date: '2026-10-05'
- id: refinement_waves_b_c
  value: Typed local evidence properties, explicit read reuse, seven risk-relevant
    profiles, lifecycle filtering, resumable publication requests and observable context
    measurement; host authentication and general model outcome gains are not claimed.
  date: '2026-10-05'
- id: refinement_wave_a
  value: Essential boot/session validation includes document and routing contracts;
    phase receipts support observed null versions without invented identifiers; audit
    and closure gates are separate.
  date: '2026-10-05'
- id: task_bound_semantic_route
  value: Lexical matches are candidates only; profile execution requires a task-bound
    semantic decision and receipt chronology.
  date: '2026-10-05'
- id: deterministic_profile_composition
  value: Each matched profile has one primary and at most three supporting skills;
    ambiguous or unresolved lexical routes require semantic review.
  date: '2026-10-04'
- id: direct_release_integrity
  value: A last-written active pointer identifies a digest manifest; loaded Core files
    must match it, and receipt coverage is bound to its release id.
  date: '2026-10-04'
- id: document_roles
  value: Every inventoried file has one declared role; YAML/JSON contracts are normative,
    active SKILL.md bodies retain instruction authority, other Markdown is supporting
    context.
  date: '2026-10-04'
- id: library_only_boot
  value: /DEDAL/core is the sole Core boot authority; archives are historical transport
  date: '2026-10-04'
- id: task_profile_hydration
  value: execution-critical workflows declare mandatory dependency sets and readiness
    gates
  date: '2026-10-04'
- id: reconstruct_not_resume
  value: new sessions rebuild accepted state from checkpoint and authoritative files
  date: '2026-10-04'
- id: contract_format
  value: machine-readable YAML and JSON are normative; Markdown is explanatory or
    skill content
  date: '2026-10-04'
- id: traceable_preflight
  value: profile receipt must identify task, source read references, conditional branches,
    and gate evidence; direct tool readback remains necessary
  date: '2026-10-04'
- id: lexical_probe_boundary
  value: deterministic profile probe flags explicit matches and ambiguity; unresolved
    tasks require semantic routing judgment
  date: '2026-10-04'
- id: resource_discovery_depth_calibration
  value: Broad resource discovery distinguishes breadth from depth. Dense or high-opportunity
    lanes require bounded follow-up beyond a token query/candidate; executed coverage
    records shallow versus expanded lanes. Creator accepted/rejected exemplars may
    calibrate private profile thresholds and search allocation but never become universal
    public facts or replace evidence for a new resource.
  date: '2026-10-06'
